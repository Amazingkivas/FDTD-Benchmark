name: Build|Test|Run

on: [push, pull_request]

jobs:
  linux-gcc-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Kokkos with OpenMP
        run: |
          cmake -S 3rdparty/kokkos -B 3rdparty/kokkos/build \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DKokkos_ENABLE_OPENMP=ON
          cmake --build 3rdparty/kokkos/build --parallel 4

      - name: Configure OpenMP and Kokkos
        run: |
          cmake -S . -B build \
            -DFDTD_BACKEND=OPENMP_KOKKOS \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build OpenMP and Kokkos
        run: cmake --build build --config Release --parallel 4

      - name: Run OpenMP tests
        run: ./build/fdtd-openmp/test_FDTD_method --gtest_repeat=2 --gtest_break_on_failure

      - name: Run Kokkos tests
        run: ./build/fdtd-kokkos/test_FDTD_method_kokkos --gtest_repeat=2 --gtest_break_on_failure

      - name: Run OpenMP sample
        run: ./build/bin/sample 512 25

      - name: Run Kokkos sample
        run: ./build/bin/kokkos_sample 512 25

      - name: Install Intel OneAPI (ifort)
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-fortran

      - name: Compile and Run Coarray program with ifx
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh intel64
          which ifx
          ifx -v
          ifx -coarray ${PWD}/fdtd-coarray/fdtd.F90 -o fdtd
          export FOR_COARRAY_NUM_IMAGES=4
          ${PWD}/fdtd
